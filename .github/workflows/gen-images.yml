name: Build Chimera Linux images

on:
  workflow_dispatch:
    inputs:
      datecode:
        description: "Date code YYYYMMDD for filenames (empty = today, UTC)"
        required: false
        default: ""
        type: string
      chimera_live_ref:
        description: "chimera-live branch, tag, or commit (empty = default branch)"
        required: false
        default: ""
        type: string

      build_live_iso:
        description: "Build Live ISOs"
        required: false
        default: false
        type: boolean
      live_archs:
        description: "Live ISO architectures; remove entries you do not want"
        required: false
        default: "x86_64 aarch64 ppc64le riscv64"
        type: string
      live_flavors:
        description: "Live ISO flavors; remove entries you do not want"
        required: false
        default: "minimal base gnome plasma"
        type: string

      build_rootfs:
        description: "Build generic ROOTFS tarballs"
        required: false
        default: false
        type: boolean
      rootfs_archs:
        description: "Generic ROOTFS architectures; remove entries you do not want"
        required: false
        default: "x86_64 aarch64 ppc64le riscv64"
        type: string
      rootfs_variants:
        description: "Generic ROOTFS variants; remove entries you do not want"
        required: false
        default: "bootstrap full"
        type: string

      build_platform_rootfs:
        description: "Build platform-specific ROOTFS tarballs"
        required: false
        default: false
        type: boolean
      platform_rootfs_targets:
        description: "Platform ROOTFS targets (ARCH-PLATFORM); remove entries you do not want"
        required: false
        default: "aarch64-rpi aarch64-pbp aarch64-quartzpro64 aarch64-rock64 aarch64-rockpro64 riscv64-unmatched"
        type: string

      build_sbc_images:
        description: "Build SBC disk images"
        required: false
        default: false
        type: boolean
      sbc_targets:
        description: "SBC image targets (ARCH-PLATFORM); remove entries you do not want"
        required: false
        default: "aarch64-rpi aarch64-pbp aarch64-quartzpro64 aarch64-rock64 aarch64-rockpro64 riscv64-unmatched"
        type: string

permissions:
  contents: read

# queue additional manual runs instead of cancelling the running one.
# do not add cancel-in-progress here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

env:
  CHIMERA_CONTAINER: chimeralinux/chimera:latest

jobs:
  prepare:
    name: Validate inputs and plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      task_count: ${{ steps.plan.outputs.task_count }}
      output_count: ${{ steps.plan.outputs.output_count }}
      datecode: ${{ steps.plan.outputs.datecode }}
      source_sha: ${{ steps.source.outputs.sha }}
      container_image: ${{ steps.container.outputs.image }}
    steps:
      - name: Check out chimera-live
        uses: actions/checkout@v7
        with:
          repository: chimera-linux/chimera-live
          ref: ${{ inputs.chimera_live_ref }}
          path: chimera-live
          persist-credentials: false

      - name: Record source commit
        id: source
        run: |
          sha=$(git -C chimera-live rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate inputs and generate matrix
        id: plan
        shell: python
        env:
          IN_DATECODE: ${{ inputs.datecode }}
          IN_BUILD_LIVE: ${{ inputs.build_live_iso }}
          IN_LIVE_ARCHS: ${{ inputs.live_archs }}
          IN_LIVE_FLAVORS: ${{ inputs.live_flavors }}
          IN_BUILD_ROOTFS: ${{ inputs.build_rootfs }}
          IN_ROOTFS_ARCHS: ${{ inputs.rootfs_archs }}
          IN_ROOTFS_VARIANTS: ${{ inputs.rootfs_variants }}
          IN_BUILD_PLATFORM_ROOTFS: ${{ inputs.build_platform_rootfs }}
          IN_PLATFORM_ROOTFS_TARGETS: ${{ inputs.platform_rootfs_targets }}
          IN_BUILD_SBC: ${{ inputs.build_sbc_images }}
          IN_SBC_TARGETS: ${{ inputs.sbc_targets }}
        run: |
          import datetime
          import json
          import os
          import re
          import sys
          from pathlib import Path

          ARCHS = ["x86_64", "aarch64", "loongarch64", "ppc64le", "riscv64"]
          LIVE_FLAVORS = ["minimal", "base", "gnome", "plasma"]
          ROOTFS_VARIANTS = ["bootstrap", "full"]
          DEVICE_PLATFORMS = {
              "aarch64": ["rpi", "pbp", "quartzpro64", "rock64", "rockpro64"],
              "riscv64": ["unmatched"],
          }
          DEVICE_TARGETS = [f"{a}-{p}" for a, ps in DEVICE_PLATFORMS.items() for p in ps]
          QEMU_PLATFORM = {"x86_64": "", "aarch64": "arm64", "loongarch64": "loong64",
                           "ppc64le": "ppc64le", "riscv64": "riscv64"}
          BINFMT_NAME = {"x86_64": "", "aarch64": "aarch64", "loongarch64": "loongarch64",
                         "ppc64le": "ppc64le", "riscv64": "riscv64"}

          env = os.environ
          errors, warnings = [], []

          def enabled(var):
              return env.get(var, "").strip().lower() == "true"

          def tokens_of(var, label, kind):
              toks = env.get(var, "").split()
              if not toks:
                  errors.append(f"'{label}' is empty but its category is enabled. "
                                f"List at least one {kind} or disable the category.")
              return toks

          def select(var, label, allowed, kind):
              toks = tokens_of(var, label, kind)
              for t in dict.fromkeys(toks):
                  if t not in allowed:
                      errors.append(f"Invalid {kind} in '{label}': {t}\n"
                                    f"Valid {kind}s: {' '.join(allowed)}")
              chosen = set(toks)
              return [a for a in allowed if a in chosen]

          def select_targets(var, label):
              toks = tokens_of(var, label, "ARCH-PLATFORM target")
              for t in dict.fromkeys(toks):
                  if t in DEVICE_TARGETS:
                      continue
                  arch, _, _ = t.partition("-")
                  if arch in DEVICE_PLATFORMS:
                      hint = f"Valid platforms for {arch}: {' '.join(sorted(DEVICE_PLATFORMS[arch]))}"
                  elif arch in ARCHS:
                      hint = f"{arch} has no device targets. Valid targets: {' '.join(DEVICE_TARGETS)}"
                  else:
                      hint = f"Unknown architecture '{arch}'. Valid targets: {' '.join(DEVICE_TARGETS)}"
                  errors.append(f"Invalid platform target in '{label}': {t}\n{hint}")
              chosen = set(toks)
              return [t for t in DEVICE_TARGETS if t in chosen]

          raw_date = env.get("IN_DATECODE", "").strip()
          if raw_date:
              datecode = raw_date
              if not re.fullmatch(r"\d{8}", raw_date):
                  errors.append(f"Invalid date code '{raw_date}': expected YYYYMMDD.")
              else:
                  try:
                      datetime.datetime.strptime(raw_date, "%Y%m%d")
                  except ValueError:
                      errors.append(f"Invalid date code '{raw_date}': not a real calendar date.")
          else:
              datecode = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")

          do_live = enabled("IN_BUILD_LIVE")
          do_rootfs = enabled("IN_BUILD_ROOTFS")
          do_prootfs = enabled("IN_BUILD_PLATFORM_ROOTFS")
          do_sbc = enabled("IN_BUILD_SBC")

          if not any([do_live, do_rootfs, do_prootfs, do_sbc]):
              errors.append("No image categories are enabled. Enable at least one of: "
                            "build_live_iso, build_rootfs, build_platform_rootfs, build_sbc_images.")

          live_archs = select("IN_LIVE_ARCHS", "live_archs", ARCHS, "architecture") if do_live else []
          live_flavors = select("IN_LIVE_FLAVORS", "live_flavors", LIVE_FLAVORS, "flavor") if do_live else []
          rootfs_archs = select("IN_ROOTFS_ARCHS", "rootfs_archs", ARCHS, "architecture") if do_rootfs else []
          rootfs_variants = select("IN_ROOTFS_VARIANTS", "rootfs_variants", ROOTFS_VARIANTS, "ROOTFS variant") if do_rootfs else []
          prootfs_targets = select_targets("IN_PLATFORM_ROOTFS_TARGETS", "platform_rootfs_targets") if do_prootfs else []
          sbc_targets = select_targets("IN_SBC_TARGETS", "sbc_targets") if do_sbc else []

          def has_case_label(path, label):
              text = Path(path).read_text(errors="replace")
              pattern = rf"""(^|[\s|("']){re.escape(label)}["']?\s*[|)]"""
              return re.search(pattern, text, re.M) is not None

          for f in live_flavors:
              if not has_case_label("chimera-live/mklive-image.sh", f):
                  errors.append(f"Live flavor '{f}' is not handled by mklive-image.sh at the "
                                f"selected chimera-live revision.")

          for p in list(dict.fromkeys(rootfs_variants + [t.split("-", 1)[1] for t in prootfs_targets + sbc_targets])):
              if not re.search(rf"\b{re.escape(p)}\b", Path("chimera-live/mkrootfs-platform.sh").read_text(errors="replace")):
                  warnings.append(f"'{p}' does not appear in mkrootfs-platform.sh; the build may fail.")

          def entry(task, arch, name):
              return {
                  "name": name, "task": task, "arch": arch,
                  "qemu_platform": QEMU_PLATFORM[arch], "binfmt": BINFMT_NAME[arch],
                  "flavor": "", "variant": "", "platform": "",
                  "iso_file": "", "rootfs_file": "", "image_file": "",
                  "want_rootfs": "false", "want_image": "false",
                  "output_primary": "", "output_image": "",
              }

          tasks = []
          for arch in live_archs:
              for fl in live_flavors:
                  e = entry("live_iso", arch, f"live-iso | {arch} | {fl}")
                  e["flavor"] = fl
                  e["iso_file"] = f"chimera-linux-{arch}-LIVE-{datecode}-{fl}.iso"
                  e["output_primary"] = e["iso_file"]
                  tasks.append(e)

          for arch in rootfs_archs:
              for v in rootfs_variants:
                  e = entry("rootfs", arch, f"rootfs | {arch} | {v}")
                  e["variant"] = v
                  e["rootfs_file"] = f"chimera-linux-{arch}-ROOTFS-{datecode}-{v}.tar.gz"
                  e["output_primary"] = e["rootfs_file"]
                  tasks.append(e)

          for t in DEVICE_TARGETS:
              want_rootfs, want_image = t in prootfs_targets, t in sbc_targets
              if not (want_rootfs or want_image):
                  continue
              arch, plat = t.split("-", 1)
              parts = [p for p, w in (("rootfs", want_rootfs), ("image", want_image)) if w]
              e = entry("device", arch, f"device | {t} | {'+'.join(parts)}")
              e["platform"] = plat
              e["rootfs_file"] = f"chimera-linux-{arch}-ROOTFS-{datecode}-{plat}.tar.gz"
              e["image_file"] = f"chimera-linux-{arch}-IMAGE-{datecode}-{plat}.img.gz"
              e["want_rootfs"] = "true" if want_rootfs else "false"
              e["want_image"] = "true" if want_image else "false"
              e["output_primary"] = e["rootfs_file"] if want_rootfs else ""
              e["output_image"] = e["image_file"] if want_image else ""
              tasks.append(e)

          seen = {}
          for e in tasks:
              for o in (e["output_primary"], e["output_image"]):
                  if o and o in seen:
                      errors.append(f"Output filename collision: {o}")
                  seen[o] = True

          for w in warnings:
              print(f"::warning::{w}")
          if errors:
              for err in errors:
                  print(f"::error::{err.replace(chr(10), '%0A')}")
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)

          output_count = sum(bool(e["output_primary"]) + bool(e["output_image"]) for e in tasks)

          with open(env["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"matrix={json.dumps(tasks, separators=(',', ':'))}\n")
              fh.write(f"task_count={len(tasks)}\n")
              fh.write(f"output_count={output_count}\n")
              fh.write(f"datecode={datecode}\n")

          n_live = len(live_archs) * len(live_flavors)
          n_rootfs = len(rootfs_archs) * len(rootfs_variants)
          with open(env["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## Build plan\n\n")
              fh.write(f"- Date code: `{datecode}`\n")
              fh.write(f"- Build tasks (matrix jobs): **{len(tasks)}**\n")
              fh.write(f"- Expected output files: **{output_count}**\n\n")
              fh.write("| Category | Enabled | Selection | Outputs |\n|---|---|---|---|\n")
              fh.write(f"| Live ISO | {do_live} | {' '.join(live_archs)} / {' '.join(live_flavors)} | {n_live} |\n")
              fh.write(f"| Generic ROOTFS | {do_rootfs} | {' '.join(rootfs_archs)} / {' '.join(rootfs_variants)} | {n_rootfs} |\n")
              fh.write(f"| Platform ROOTFS | {do_prootfs} | {' '.join(prootfs_targets)} | {len(prootfs_targets)} |\n")
              fh.write(f"| SBC image | {do_sbc} | {' '.join(sbc_targets)} | {len(sbc_targets)} |\n\n")
              if output_count > 10:
                  fh.write(f"> **Large build:** {output_count} images requested.\n\n")

      - name: Resolve container image digest
        id: container
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet "$CHIMERA_CONTAINER" >/dev/null
          image="$(
            docker image inspect \
              --format='{{range .RepoDigests}}{{println .}}{{end}}' \
              "$CHIMERA_CONTAINER" |
              sed -n '1p'
          )"

          if [[ ! "$image" =~ ^((docker\.io|index\.docker\.io)/)?chimeralinux/chimera@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve a valid immutable digest for $CHIMERA_CONTAINER."
            echo "::error::Received: '${image:-<empty>}'"
            exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"

          {
            echo "## Container provenance"
            echo
            echo "- Requested image: \`$CHIMERA_CONTAINER\`"
            echo "- Resolved immutable image: \`$image\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.task_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CONTAINER_IMAGE: ${{ needs.prepare.outputs.container_image }}
      DATECODE: ${{ needs.prepare.outputs.datecode }}
      TASK: ${{ matrix.task }}
      ARCH: ${{ matrix.arch }}
      FLAVOR: ${{ matrix.flavor }}
      VARIANT: ${{ matrix.variant }}
      PLATFORM: ${{ matrix.platform }}
      ISO_FILE: ${{ matrix.iso_file }}
      ROOTFS_FILE: ${{ matrix.rootfs_file }}
      IMAGE_FILE: ${{ matrix.image_file }}
      WANT_ROOTFS: ${{ matrix.want_rootfs }}
      WANT_IMAGE: ${{ matrix.want_image }}
      QEMU_PLATFORM: ${{ matrix.qemu_platform }}
      BINFMT: ${{ matrix.binfmt }}
      PROBE_IMAGE: alpine:latest
    steps:
      - name: Check out chimera-live (pinned to planned commit)
        uses: actions/checkout@v7
        with:
          repository: chimera-linux/chimera-live
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: chimera-live
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h "$GITHUB_WORKSPACE"

      - name: Set up QEMU (${{ matrix.qemu_platform }})
        if: matrix.qemu_platform != ''
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu_platform }}

      - name: Verify foreign-architecture execution
        if: matrix.qemu_platform != ''
        run: |
          set -euo pipefail
          entry="/proc/sys/fs/binfmt_misc/qemu-$BINFMT"
          if [[ ! -r $entry ]]; then
            echo "::error::Target $ARCH is unsupported by this runner configuration: no binfmt_misc handler at $entry."
            exit 1
          fi
          cat "$entry"
          grep -qx enabled "$entry" || { echo "::error::binfmt handler for $ARCH is registered but disabled."; exit 1; }
          # The F (fix-binary) flag makes the handler usable inside containers.
          grep -Eq '^flags:.*F' "$entry" || { echo "::error::binfmt handler for $ARCH lacks the F flag; it will not work inside the build container."; exit 1; }

          if ! docker pull -q --platform "linux/$QEMU_PLATFORM" "$PROBE_IMAGE" >/dev/null 2>&1; then
            echo "::error::Cannot pull probe image '$PROBE_IMAGE' for linux/$QEMU_PLATFORM."
            echo "::error::Target execution has not been verified. Refusing to continue."
            exit 1
          fi

          if ! got=$(docker run --rm --platform "linux/$QEMU_PLATFORM" "$PROBE_IMAGE" uname -m); then
            echo "::error::Could not execute a $QEMU_PLATFORM container through QEMU."
            exit 1
          fi

          if [[ "$got" != "$ARCH" ]]; then
            echo "::error::Execution probe for $ARCH returned '$got', expected '$ARCH'."
            exit 1
          fi

          echo "Execution probe OK: $got"

      - name: Write helper scripts
        run: |
          mkdir -p .ci out tmp

          cat > .ci/build.sh <<'EOF'
          #!/bin/sh
          set -eu
          STAGE=${1:?usage: build.sh primary|image}
          OUT=/work/out
          TMP=/work/tmp

          log() { printf '==> %s\n' "$*"; }
          die() { printf 'error: %s\n' "$*" >&2; exit 1; }
          fix_owner() { chown -R "$HOST_UID:$HOST_GID" "$OUT" "$TMP" 2>/dev/null || :; }
          trap fix_owner EXIT

          need_tools() {
              missing=
              for t in "$@"; do
                  command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
              done
              [ -z "$missing" ] || die "required executables not found:$missing"
          }

          device_rootfs_path() {
              if [ "$WANT_ROOTFS" = true ]; then
                  echo "$OUT/$ROOTFS_FILE"
              else
                  echo "$TMP/$ROOTFS_FILE"
              fi
          }

          log "Installing base build dependencies"
          apk update
          apk add util-linux-mount
          need_tools mount umount losetup

          case "$STAGE" in
          primary)
              case "$TASK" in
              live_iso)
                  log "Live ISO: $ISO_FILE"
                  ./mklive-image.sh -b "$FLAVOR" -- -a "$ARCH" -o "$OUT/$ISO_FILE"
                  ;;
              rootfs)
                  log "Generic ROOTFS: $ROOTFS_FILE"
                  ./mkrootfs-platform.sh -P "$VARIANT" -- -a "$ARCH" -o "$OUT/$ROOTFS_FILE"
                  ;;
              device)
                  path=$(device_rootfs_path)
                  log "Platform ROOTFS ($PLATFORM): $path"
                  ./mkrootfs-platform.sh -P "$PLATFORM" -- -a "$ARCH" -o "$path"
                  [ -s "$path" ] || die "platform ROOTFS was not produced: $path"
                  ;;
              *) die "unknown task: $TASK" ;;
              esac
              ;;
          image)
              [ "$TASK" = device ] || die "image stage is only valid for device tasks"
              log "Installing disk image dependencies"
              apk add util-linux-fdisk dosfstools e2fsprogs
              need_tools sfdisk mkfs.vfat mkfs.ext4 tar truncate
              path=$(device_rootfs_path)
              [ -s "$path" ] || die "platform ROOTFS prerequisite missing: $path"
              log "SBC image ($PLATFORM) from $path"
              ./mkimage.sh -o "$OUT/${IMAGE_FILE%.gz}" "$path"
              ;;
          *) die "unknown stage: $STAGE" ;;
          esac
          EOF

          cat > .ci/finalize.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          name=$1
          cd "$GITHUB_WORKSPACE/out"
          fail() { echo "::error::$*"; ls -la; exit 1; }

          if [[ $name == *.img.gz && ! -e $name && -e ${name%.gz} ]]; then
            gzip -9 -- "${name%.gz}"
          fi
          [[ -f $name ]] || fail "Expected output not found: $name"
          [[ -s $name ]] || fail "Output is empty: $name"

          case "$name" in
            *.iso)    file -b -- "$name" | grep -q 'ISO 9660' || fail "$name is not an ISO 9660 image" ;;
            *.tar.gz) tar -tzf "$name" >/dev/null || fail "$name is not a readable gzip tarball" ;;
            *.img.gz) gzip -t -- "$name" || fail "$name is not a valid gzip file" ;;
            *)        fail "Unexpected output extension: $name" ;;
          esac

          sha256sum -- "$name" > "$name.sha256"
          sha256sum -c -- "$name.sha256"

          if [[ ! -e $GITHUB_WORKSPACE/.ci/summary-header ]]; then
            printf '### Outputs\n\n| File | Size | SHA-256 |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
            touch "$GITHUB_WORKSPACE/.ci/summary-header"
          fi
          printf '| `%s` | %s | `%s` |\n' "$name" "$(du -h -- "$name" | cut -f1)" \
            "$(cut -d' ' -f1 "$name.sha256")" >> "$GITHUB_STEP_SUMMARY"
          EOF
          chmod +x .ci/finalize.sh

      - name: Build primary output
        id: primary
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" -v /dev:/dev \
            -w /work/chimera-live \
            -e TASK -e ARCH -e FLAVOR -e VARIANT -e PLATFORM \
            -e ISO_FILE -e ROOTFS_FILE -e IMAGE_FILE \
            -e WANT_ROOTFS -e WANT_IMAGE -e DATECODE \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$CONTAINER_IMAGE" sh /work/.ci/build.sh primary

      - name: Verify and checksum ${{ matrix.output_primary }}
        if: matrix.output_primary != ''
        run: .ci/finalize.sh "${{ matrix.output_primary }}"

      - name: Upload ${{ matrix.output_primary }}
        if: matrix.output_primary != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_primary }}
          path: |
            out/${{ matrix.output_primary }}
            out/${{ matrix.output_primary }}.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Build SBC disk image
        if: matrix.want_image == 'true'
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" -v /dev:/dev \
            -w /work/chimera-live \
            -e TASK -e ARCH -e PLATFORM \
            -e ROOTFS_FILE -e IMAGE_FILE \
            -e WANT_ROOTFS -e WANT_IMAGE -e DATECODE \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$CONTAINER_IMAGE" sh /work/.ci/build.sh image

      - name: Verify and checksum ${{ matrix.output_image }}
        if: matrix.want_image == 'true'
        run: .ci/finalize.sh "${{ matrix.output_image }}"

      - name: Upload ${{ matrix.output_image }}
        if: matrix.want_image == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_image }}
          path: |
            out/${{ matrix.output_image }}
            out/${{ matrix.output_image }}.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Clean up intermediates
        if: always()
        run: |
          # Container mounts are private to the container's namespace, but
          # stay defensive: never recurse across filesystem boundaries.
          sudo rm -rf --one-file-system \
            "$GITHUB_WORKSPACE/tmp" "$GITHUB_WORKSPACE/out" \
            "$GITHUB_WORKSPACE/chimera-live/build" || true
